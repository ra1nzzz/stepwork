# STEPWORK CI Pipeline
#
# 触发策略：push 到 main + 所有 PR
# 并发控制：同一分支的新 push 取消旧 run
#
# 三个独立 job：
#   - rust-check  ：apps/desktop/src-tauri 的 cargo check/clippy/fmt/test
#   - frontend-check：apps/desktop 的 tsc --noEmit + vitest 单测 + 生产构建
#   - python-check ：worker 的 ruff / mypy / pytest（从仓库根 pyproject.toml 安装 -e .[dev]），
#                    外加仓库根的 cli/tests + mcp/tests；worker pytest 跳过 perf 标记
#                    （性能基线仅手动跑，见 docs/PERF_BASELINE.md）
#
# 注：cargo *不* 执行 `tauri build`，仅 check/test，故无需 WebView2 运行时，
# 在 windows-latest 上可直接通过。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Check (Tauri Host)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo test
        run: cargo test --all-targets

  frontend-check:
    name: Frontend Check (React + TS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (app)
        run: npx tsc --noEmit -p tsconfig.json

      - name: TypeScript check (node config)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  python-check:
    name: Python Check (Worker)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: '~\AppData\Local\pip\Cache'
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 从**仓库根**跑：原先带 working-directory: worker，于是 scripts/（两道门禁
      # 本体）、cli/（CLI 入口）、mcp/（MCP 服务端）全在 lint 覆盖之外 —— 都是生产
      # 代码却没人看。根目录只有一份 pyproject.toml，规则与在 worker/ 内跑完全一致。
      # ruff 默认 respect-gitignore，故 .workbuddy/ 下的验收探针不会被扫到。
      - name: Ruff lint
        run: ruff check .

      - name: 响应契约生成物同步检查
        run: python scripts/gen_result_types.py --check

      # S6 验收清单第一条（P4）：GUI 能做但 CLI 做不到的能力会在这里被点名。
      # 已有欠账冻结在脚本的 _KNOWN_GAP 里（只许减不许增），新增缺口直接红。
      - name: GUI/CLI 能力对等检查
        run: python scripts/check_ui_parity.py

      # S6 验收清单第四条：MCP 工具清单与命令总线必须自动同步。
      # 这条把「MCP 只读、update_config 永不注册」从注释变成代码事实。
      - name: MCP 工具面一致性检查
        run: python scripts/check_mcp_surface.py

      - name: Type check (mypy)
        working-directory: worker
        run: mypy .

      # 与 ruff 同理：cli / mcp / scripts 不在 worker 的工作目录内，此前不被任何
      # mypy 步骤覆盖。目标写**显式目录**而不是 `.`：mypy 不读 .gitignore，`.` 会把
      # 本地的 .workbuddy/ 验收探针也拉进来 —— 那些文件 CI 里根本不存在，
      # 于是「本地红、CI 绿」，最难查的一类不一致。
      - name: Type check (mypy: cli/mcp/scripts)
        run: mypy cli mcp scripts

      # perf 标记的性能基线测试默认不进 CI（docs/PERF_BASELINE.md）
      - name: Pytest (worker)
        working-directory: worker
        run: pytest tests -q -m "not perf"

      # cli / mcp 测试从仓库根运行（import cli / mcp 依赖仓库根在 sys.path）
      - name: Pytest (cli + mcp)
        run: pytest cli/tests mcp/tests -q
