<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>STEPWORK S1 probe</title>
<style>
  /* S1 探路文档：零外部依赖（无字体/无图片/无网络），仅用于证明
     「Playwright 逐帧 + ffmpeg 管道直连」链路可用。不是正式模板——
     正式模板属 S3 风格层，届时改 render/templates.py，不动本文件。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: #0B0D12;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #F5F7FA;
    position: relative;
  }
  #glow {
    position: absolute; left: 50%; top: 38%;
    width: 1400px; height: 1400px; margin: -700px 0 0 -700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,92,255,.55) 0%, rgba(124,92,255,0) 62%);
    transform: translate3d(0,0,0);
  }
  #bar { position: absolute; left: 0; top: 0; height: 10px; width: 0%; background: #7C5CFF; }
  #time {
    position: absolute; left: 0; right: 0; top: 760px; text-align: center;
    font-size: 150px; font-weight: 700; letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
  }
  #scene { position: absolute; left: 0; right: 0; top: 980px; text-align: center; font-size: 54px; color: #9AA4B2; }
  #mark { position: absolute; left: 80px; bottom: 120px; font-size: 44px; color: #4A5364; letter-spacing: 2px; }
  /* S2：配图区。有 imageUri 才显示；没有就整块隐藏（不是留一个裂图占位） */
  #art {
    position: absolute; left: 90px; right: 90px; top: 300px; height: 780px;
    display: none; align-items: center; justify-content: center;
  }
  #art img { max-width: 100%; max-height: 100%; border-radius: 24px; }
  #cap {
    position: absolute; left: 0; right: 0; top: 1180px; text-align: center;
    font-size: 60px; line-height: 1.45; color: #F5F7FA; padding: 0 80px;
  }
  #cap em { font-style: normal; color: #7C5CFF; }
</style>
</head>
<body>
  <div id="bar"></div>
  <div id="glow"></div>
  <div id="art"><img id="artimg" alt=""></div>
  <div id="time">0.00</div>
  <div id="scene">scene 1</div>
  <div id="cap"></div>
  <div id="mark">STEPWORK · S1 frame-by-frame probe</div>
<script>
  // 幕数据由渲染器通过 add_init_script 注入（S2）。
  // SCENES 是完整的（文本/配图/高亮/起止秒）；SCENE_DURATIONS 是 S1 就有的
  // 老契约，只给时长 —— 没有 SCENES 时（老调用方）退化成「只按时长切幕」。
  var SCENES = (window.SCENES && window.SCENES.length) ? window.SCENES : null;
  var DUR = SCENES
    ? SCENES.map(function (s) { return s.durationSec || 0; })
    : ((window.SCENE_DURATIONS && window.SCENE_DURATIONS.length)
        ? window.SCENE_DURATIONS
        : [0]);
  var TOTAL = DUR.reduce(function (a, b) { return a + b; }, 0);

  function sceneAt(t) {
    var acc = 0;
    for (var i = 0; i < DUR.length; i++) {
      acc += DUR[i];
      if (t < acc) return { i: i, local: t - (acc - DUR[i]), dur: DUR[i] };
    }
    return { i: DUR.length - 1, local: DUR[DUR.length - 1], dur: DUR[DUR.length - 1] };
  }

  // highlight 必须是 text 的子串（handler 入口已校验），这里只做渲染
  function paintCap(s) {
    var el = document.getElementById('cap');
    if (!SCENES) { el.textContent = ''; return; }
    var text = s.text || '';
    var hi = s.highlight;
    if (hi && text.indexOf(hi) >= 0) {
      var at = text.indexOf(hi);
      el.innerHTML = '';
      el.appendChild(document.createTextNode(text.slice(0, at)));
      var em = document.createElement('em');
      em.textContent = hi;
      el.appendChild(em);
      el.appendChild(document.createTextNode(text.slice(at + hi.length)));
    } else {
      el.textContent = text;
    }
  }

  function paintArt(s) {
    var box = document.getElementById('art');
    var img = document.getElementById('artimg');
    if (!SCENES) { box.style.display = 'none'; return; }
    if (s.imageUri) {
      if (img.getAttribute('src') !== s.imageUri) img.setAttribute('src', s.imageUri);
      box.style.display = 'flex';
    } else {
      box.style.display = 'none';
    }
  }

  // 渲染器逐帧调用：必须是时间的纯函数（同一 t 出同一画面）。
  window.__setTime = function (t) {
    if (t < 0) t = 0;
    var s = sceneAt(t);
    var one = SCENES ? SCENES[s.i] : null;
    document.getElementById('time').textContent = t.toFixed(2);
    document.getElementById('scene').textContent =
      'scene ' + (s.i + 1) + ' / ' + DUR.length;
    paintCap(one || {});
    paintArt(one || {});
    var pct = TOTAL > 0 ? Math.min(100, (t / TOTAL) * 100) : 0;
    document.getElementById('bar').style.width = pct + '%';
    // 光晕随幕内进度上浮 + 轻微位移，保证每一帧画面确实不同
    var k = s.dur > 0 ? s.local / s.dur : 0;
    document.getElementById('glow').style.transform =
      'translate3d(0,' + (-60 + k * 120).toFixed(2) + 'px,0) scale(' + (0.9 + k * 0.2).toFixed(4) + ')';
    document.getElementById('glow').style.opacity = (0.55 + 0.35 * Math.sin(t * 1.7)).toFixed(3);
  };

  // 各幕首句在画面上的实际出现秒（渲染器据此回填 video_scenes.born_at_sec）。
  // 本文档**没有前摇**：字幕随幕开始即刻出现，所以就是 startSec。有入场动画
  // 的正式模板会返回更晚的秒 —— 那正是抽帧目检需要的值（S1 遗留项）。
  window.__getSentBorn = function (i) {
    if (!SCENES || i < 0 || i >= SCENES.length) return null;
    return SCENES[i].startSec;
  };

  window.__setTime(0);
</script>
</body>
</html>
